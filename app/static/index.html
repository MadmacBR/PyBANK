<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PyBank Digital & Analytics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="mx-auto max-w-5xl px-4 py-10">
    <header class="mb-8"><p class="text-sm font-semibold uppercase tracking-widest text-emerald-400">PyBank Digital & Analytics</p><h1 class="mt-2 text-3xl font-bold">Sua vida financeira, em um só lugar</h1></header>
    <section id="auth" class="grid gap-6 md:grid-cols-2">
      <form id="create-form" class="rounded-2xl bg-slate-900 p-6 shadow-xl">
        <h2 class="mb-4 text-xl font-semibold">Criar conta</h2>
        <label class="mb-3 block text-sm">Nome<input name="name" required minlength="2" class="mt-1 w-full rounded-lg bg-slate-800 p-3" /></label>
        <label class="mb-4 block text-sm">Senha (mínimo 8 caracteres)<input name="password" type="password" required minlength="8" class="mt-1 w-full rounded-lg bg-slate-800 p-3" /></label>
        <button class="rounded-lg bg-emerald-500 px-4 py-2 font-semibold text-slate-950">Abrir conta</button>
      </form>
      <form id="login-form" class="rounded-2xl bg-slate-900 p-6 shadow-xl">
        <h2 class="mb-4 text-xl font-semibold">Acessar conta</h2>
        <label class="mb-3 block text-sm">Número da conta<input name="account" required class="mt-1 w-full rounded-lg bg-slate-800 p-3" /></label>
        <label class="mb-4 block text-sm">Senha<input name="password" type="password" required class="mt-1 w-full rounded-lg bg-slate-800 p-3" /></label>
        <button class="rounded-lg bg-emerald-500 px-4 py-2 font-semibold text-slate-950">Entrar</button>
      </form>
    </section>
    <p id="message" role="status" class="my-5 text-amber-300"></p>
    <section id="dashboard" class="hidden space-y-6">
      <div class="flex flex-wrap items-center justify-between gap-4 rounded-2xl bg-slate-900 p-6"><div><p class="text-slate-400">Olá, <span id="customer"></span></p><p class="mt-1 text-sm text-slate-500">Conta <span id="account-number"></span></p><p class="mt-3 text-3xl font-bold">R$ <span id="balance">0,00</span></p></div><button id="logout" class="rounded-lg border border-slate-600 px-4 py-2">Sair</button></div>
      <div class="grid gap-6 md:grid-cols-3">
        <form data-action="deposit" class="rounded-2xl bg-slate-900 p-5"><h2 class="mb-3 font-semibold">Depositar</h2><input name="amount" type="number" min="0.01" step="0.01" required placeholder="Valor em R$" class="mb-3 w-full rounded-lg bg-slate-800 p-3"><button class="rounded-lg bg-emerald-500 px-4 py-2 font-semibold text-slate-950">Confirmar</button></form>
        <form data-action="withdraw" class="rounded-2xl bg-slate-900 p-5"><h2 class="mb-3 font-semibold">Sacar</h2><input name="amount" type="number" min="0.01" step="0.01" required placeholder="Valor em R$" class="mb-3 w-full rounded-lg bg-slate-800 p-3"><button class="rounded-lg bg-emerald-500 px-4 py-2 font-semibold text-slate-950">Confirmar</button></form>
        <form data-action="transfer" class="rounded-2xl bg-slate-900 p-5"><h2 class="mb-3 font-semibold">Transferir</h2><input name="destination_account" required placeholder="Conta de destino" class="mb-2 w-full rounded-lg bg-slate-800 p-3"><input name="amount" type="number" min="0.01" step="0.01" required placeholder="Valor em R$" class="mb-3 w-full rounded-lg bg-slate-800 p-3"><button class="rounded-lg bg-emerald-500 px-4 py-2 font-semibold text-slate-950">Confirmar</button></form>
      </div>
      <div class="rounded-2xl bg-slate-900 p-6"><h2 class="mb-4 text-xl font-semibold">Evolução do saldo</h2><canvas id="balance-chart"></canvas></div>
      <div class="rounded-2xl bg-slate-900 p-6"><h2 class="mb-4 text-xl font-semibold">Extrato</h2><div class="overflow-x-auto"><table class="w-full text-left text-sm"><thead class="text-slate-400"><tr><th class="p-2">Data</th><th class="p-2">Operação</th><th class="p-2">Valor</th><th class="p-2">Conta relacionada</th></tr></thead><tbody id="statement"></tbody></table></div></div>
    </section>
  </main>
<script>
const $ = (selector) => document.querySelector(selector);
let credentials = sessionStorage.getItem('pybankCredentials') || '';
let chart;
const message = (text) => { $('#message').textContent = text; };
async function api(path, options = {}) {
  const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
  if (credentials) headers.Authorization = `Basic ${credentials}`;
  const response = await fetch(path, { ...options, headers });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.detail || 'Não foi possível concluir a operação');
  return data;
}
function startSession(account, password) {
  credentials = btoa(`${account}:${password}`);
  sessionStorage.setItem('pybankCredentials', credentials);
  return refresh();
}
async function refresh() {
  const me = await api('/accounts/me');
  $('#auth').classList.add('hidden'); $('#dashboard').classList.remove('hidden');
  $('#customer').textContent = me.name; $('#account-number').textContent = me.account_number;
  $('#balance').textContent = Number(me.balance).toLocaleString('pt-BR', { minimumFractionDigits: 2 });
  const [transactions, points] = await Promise.all([api('/transactions'), api('/transactions/evolution')]);
  $('#statement').innerHTML = transactions.map((item) => `<tr class="border-t border-slate-800"><td class="p-2">${new Date(item.created_at).toLocaleString('pt-BR')}</td><td class="p-2">${item.description}</td><td class="p-2">R$ ${Number(item.amount).toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</td><td class="p-2">${item.related_account || '—'}</td></tr>`).join('') || '<tr><td class="p-2" colspan="4">Nenhuma transação ainda.</td></tr>';
  if (chart) chart.destroy();
  chart = new Chart($('#balance-chart'), { type: 'line', data: { labels: points.map(p => new Date(p.date).toLocaleString('pt-BR')), datasets: [{ label: 'Saldo (R$)', data: points.map(p => Number(p.balance)), borderColor: '#34d399', backgroundColor: 'rgba(52,211,153,.12)', fill: true, tension: .25 }] }, options: { responsive: true, scales: { y: { beginAtZero: true } } } });
}
$('#create-form').addEventListener('submit', async (event) => { event.preventDefault(); const form = new FormData(event.currentTarget); try { const account = await api('/accounts', { method: 'POST', body: JSON.stringify({ name: form.get('name'), password: form.get('password') }) }); message(`Conta criada! Seu número é ${account.account_number}. Guarde-o para entrar.`); $('#login-form [name="account"]').value = account.account_number; } catch (error) { message(error.message); } });
$('#login-form').addEventListener('submit', async (event) => { event.preventDefault(); const form = new FormData(event.currentTarget); try { await startSession(form.get('account'), form.get('password')); message(''); } catch (error) { credentials = ''; sessionStorage.removeItem('pybankCredentials'); message(error.message); } });
document.querySelectorAll('form[data-action]').forEach(form => form.addEventListener('submit', async (event) => { event.preventDefault(); const fields = Object.fromEntries(new FormData(form)); try { await api(`/transactions/${form.dataset.action}`, { method: 'POST', body: JSON.stringify(fields) }); message('Operação concluída com sucesso.'); form.reset(); await refresh(); } catch (error) { message(error.message); } }));
$('#logout').addEventListener('click', () => { credentials = ''; sessionStorage.removeItem('pybankCredentials'); $('#dashboard').classList.add('hidden'); $('#auth').classList.remove('hidden'); message('Sessão encerrada.'); });
if (credentials) refresh().catch(() => { credentials = ''; sessionStorage.removeItem('pybankCredentials'); });
</script>
</body>
</html>
